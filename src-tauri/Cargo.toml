[package]
name = "codex-squire-desktop"
version = "0.2.2"
description = "Codex Squire desktop runtime"
authors = ["Codex Squire contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "codex_squire_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tiny_http = "0.12"
