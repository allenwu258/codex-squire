[package]
name = "codex-squire-desktop"
version = "0.2.3"
description = "Codex Squire desktop runtime"
authors = ["Codex Squire contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "codex_squire_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi"] }
